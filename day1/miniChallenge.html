<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Challenge</title>
</head>

<body>
  <form action="">
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" /> <br /><br />

    <label for="gender">Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male" />
    <label for="male">Male</label> <br>
    <input type="radio" id="female" name="gender" value="female" />
    <label for="female">Female</label>
    <br />
    <br />

    <label for="programming">Programming Interest:</label> <br />
    <input type="checkbox" id="frontend" name="programming" value="frontend" />
    Frontend <br />
    <input type="checkbox" id="backend" name="programming" value="backend" />
    Backend <br />
    <input type="checkbox" id="database" name="programming" value="database" />
    Database <br />
    <br /><br />

    <label for="level">Current Level:</label> <br />
    <select id="level" name="level">
      <option value="beginner" selected>Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
    <br /><br />
    <label for="sendmessages">Send Messages:</label> 
    <br />
    <button type="submit" name="sendmessages">Send Messages</button>
    <br /><br />
  </form>
</body>

</html>
