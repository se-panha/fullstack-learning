<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Challenge</title>
</head>

<body>
  <form action="">
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" /> <br /><br />

    <label for="gender">Gender:</label>
    <select id="gender" name="gender">
      <br />
      <option value="male">Male</option>
      <br />
      <option value="female">Female</option>
    </select>
    <br />
    <br />

    <label for="programming">Programming Interest:</label> <br />
    <input type="checkbox" id="programming" name="programming" value="frontend" />
    Frontend <br />
    <input type="checkbox" id="programming" name="programming" value="backend" />
    Backend <br />
    <input type="checkbox" id="programming" name="programming" value="database" />
    Database <br />
    <br /><br />

    <label for="level">Current Level:</label> <br />
    <select id="level" name="level">
      <br />
      <option value="beginner" selected>Beginner</option>
      <br />
      <option value="intermediate">Intermediate</option>
      <br />
      <option value="advanced">Advanced</option>
      <br />
    </select>
    <br /><br />
    <label for="sendmessages">Send Messages:</label> <br />
    <textarea name="sendmessages" id="sendmessages" placeholder="Enter your messages here..."></textarea>
    <br />
    <button type="submit" name="sendmessages">Send Messages</button>
    <br /><br />
  </form>
</body>

</html>
