<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Challenge</title>
  </head>
  <body>
    <form action="">
      <label for="Date of Birth"><h1>Date of Birth:</h1></label>
      <input type="date" id="dob" name="dob" style="width: 300px" />
      <label for="Gender"><h2>Gender:</h2></label>
      <input type="radio" id="male" name="gender" value="male" />
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">Female</label> <br />
      <label for="programmingLanguage"><h2>Programming interests:</h2></label>
      <input
        type="checkbox"
        id="fronend"
        name="programmingLanguage"
        value="fronend"
      />
      <label for="fronend">Fronend</label> <br />
      <input
        type="checkbox"
        id="backend"
        name="programmingLanguage"
        value="backend"
      />
      <label for="backend">Backend</label> <br />
      <input
        type="checkbox"
        id="database"
        name="programmingLanguage"
        value="database"
      />
      <label for="database">Database</label> <br />
      <label for="currentLevel"><h2>Current Level:</h2></label>
      <select id="currentLevel" name="currentLevel" style="width: 300px">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
      <br />
      <br />
      <button
        type="submit"
        style="width: 300px; height: 30px; background-color: blue; color: white"
      >
        Send Message
      </button>
    </form>
    <footer>
      <p>© 2026 Se Panha</p>
    </footer>
  </body>
</html>
